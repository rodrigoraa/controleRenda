name: Validar aplicação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: controle_test
          POSTGRES_PASSWORD: test_password_ci_only
          POSTGRES_DB: controle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd 'pg_isready -U controle_test -d controle_test'
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://controle_test:test_password_ci_only@127.0.0.1:5432/controle_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: test_password_ci_only
          APP_DB_PASSWORD: test_app_password_ci_only
          APP_ORIGIN: https://financas.example.test
